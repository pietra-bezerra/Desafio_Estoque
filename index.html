<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP</title>

    <!-- Estilização -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonte Usada (Diretamente do Google Fonts)  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icone da Página -->
    <link rel="shortcut icon" href="assets/imgs/logo.png" type="image/x-icon">
</head>

<body>
    <button onclick="mudarTema()" id="temaSelecionado" class="temaNoturno">
        <i class="bi bi-moon-stars-fill"></i>
    </button>
    <main class="caixa-main-login">
        <form action="" class="caixa-form-login">
            <img src="assets/imgs/logo.png" alt="Logo">
            <div class="caixa-div-login">
                <div class="caixa-input-login">
                    <label for="email"><i class="bi bi-person"></i>E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@exemplo.com">
                </div>
                <div class="caixa-input-login">
                    <label for="senha"><i class="bi bi-shield-lock"></i>Senha</label>
                    <input type="password" id="senha" placeholder="********">
                </div>
            </div>
            <div class="caixa-btn-login">
                <button type="submit">Entrar<i class="bi bi-box-arrow-in-right"></i></button>
                <div class="caixa-opcoes-btn-login">
                    <a href="#" onclick="showCadastro()">Cadastre-se</a>
                </div>
                <div class="caixa-opcoes-btn-login">
                    <a href="#" onclick="showEsqueceu()">Esqueceu sua senha?</a>
                </div>
            </div>
        </form>

        <section class="caixa-sec-cadastro">
            <form action="" class="caixa-form-login">
                <button id="btnDiferente" onclick="document.querySelector('.caixa-sec-cadastro').style.display = 'none'"><i class="bi bi-x"></i></button>
                <div class="ladoUm ">
                    <div class="caixa-input-login">
                        <label for="nome"><i class="bi bi-person"></i>Nome</label>
                        <input type="nome" id="nome" placeholder="Seu N. Completo">
                    </div>
                    <div class="caixa-input-login">
                        <label for="email"><i class="bi bi-envelope-at-fill"></i>E-mail</label>
                        <input type="email" id="email" placeholder="exemplo@exemplo.com">
                    </div>
                    <div class="caixa-input-login">
                        <label for="cpf"><i class="bi bi-person-vcard"></i>CPF</label>
                        <input type="cpf" id="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="caixa-input-login">
                        <label for="codigo"><i class="bi bi-file-medical"></i>Código de Identificação</label>
                        <input type="codigo" id="codigo" placeholder="2BNA3RSD">
                    </div>
                    <div class="caixa-input-login">
                        <label for="senha"><i class="bi bi-shield-lock"></i>Senha</label>
                        <input type="password" id="senha" placeholder="********">
                    </div>
                </div>
                <div class="ladoDois">
                    <img src="assets/imgs/logo.png" alt="Logo">
                    <button>Cadastrar</button>
                </div>
            </form>
        </section>

        <section class="caixa-sec-esqueceu">
            <form action="" class="caixa-form-login">
                <button id="btnDiferente" onclick="document.querySelector('.caixa-sec-esqueceu').style.display = 'none'"><i class="bi bi-x"></i></button>
                <img src="assets/imgs/logo.png" alt="Logo">
                <div class="caixa-div-login">
                    <div class="caixa-input-login">
                        <label for="email"><i class="bi bi-person"></i>E-mail</label>
                        <input type="email" id="email" placeholder="exemplo@exemplo.com">
                    </div>
                    <div class="caixa-input-login">
                        <label for="codigo"><i class="bi bi-person"></i>Código de Identificação</label>
                        <input type="codigo" id="codigo" placeholder="2BNA3RSD">
                    </div>
                    <div class="caixa-input-login">
                        <label for="senha"><i class="bi bi-shield-lock"></i>Senha</label>
                        <input type="password" id="senha" placeholder="********">
                    </div>
                </div>
                <div class="caixa-btn-login">
                    <button type="submit">Entrar<i class="bi bi-box-arrow-in-right"></i></button>
                    <div class="caixa-opcoes-btn-login">
                        <a href="#" onclick="showCadastro()">Cadastre-se</a>
                    </div>
                    <div class="caixa-opcoes-btn-login">
                        <a href="#" onclick="showEsqueceu()">Esqueceu sua senha?</a>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <!-- JS -->
    <script src="scripts/script.js"></script>
</body>

</html>
